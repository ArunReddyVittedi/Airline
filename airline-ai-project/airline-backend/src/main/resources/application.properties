spring.application.name=airline-backend
server.port=${PORT:8080}

# ---------- Database ----------
# These point at the container in docker-compose.yml, which spring-boot-docker-compose
# starts for us on host port 5433.
#
# You will read in a lot of places that these properties can be left off, because the
# compose support contributes a JdbcConnectionDetails bean. Do not rely on it: with an
# explicit spring.datasource.url present, the property wins, and the app quietly connects
# to whatever Postgres happens to be on the port in the url. On a machine with its own
# Postgres on 5432 that means logging into the wrong database, and the symptom is a
# password error that looks nothing like a configuration problem.
#
# Spelling them out and matching the compose file is boring and always correct.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/airline}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:telusko}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CREATE EXTENSION vector, which has to happen before LangChain4j creates its table.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init/schema.sql

# ---------- OpenAI ----------
# Never commit the key. Set OPENAI_API_KEY in the environment or the run configuration.
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
# Every answer here is either parsed, or turned into a booking. Zero is the only sane value.
langchain4j.open-ai.chat-model.temperature=0.0
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

# The travel assistant streams, so it needs the streaming model as well as the blocking one.
langchain4j.open-ai.streaming-chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.streaming-chat-model.model-name=gpt-4o-mini
langchain4j.open-ai.streaming-chat-model.temperature=0.0

# text-embedding-3-small is 1536 dimensions and about five times cheaper than -large.
# For airline policy text the quality difference did not show up in retrieval.
langchain4j.open-ai.embedding-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.embedding-model.model-name=text-embedding-3-small

# ---------- RAG ----------
# Must match the embedding model above. A mismatch fails at insert time, not at startup,
# which is a confusing place to find out.
airline.rag.dimension=1536
airline.rag.table=airline_knowledge
# How many chunks to put in front of the model. Five keeps the prompt affordable and has
# been enough for every policy question in the seed knowledge base.
airline.rag.max-results=5
# Cosine score below this counts as no match. Without a floor the store always hands back
# its nearest rows, so an unrelated question still retrieves text and invites invention.
airline.rag.min-score=0.70

# ---------- MCP ----------
# The ops server is a plain jar that this app launches itself, so only the path is needed.
# Run mvn clean package in airline-mcp-server first.
airline.mcp.server-jar=../airline-mcp-server/target/airline-ops-mcp-server.jar
airline.mcp.enabled=true

# ---------- Auth ----------
# HS256 needs at least 32 bytes. Override with a real secret outside local development.
security.jwt.secret=${JWT_SECRET:dev-only-airline-jwt-secret-change-me-32bytes}
security.jwt.issuer=telusko-airline
security.jwt.access-minutes=60

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ---------- Monitoring ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=airline-backend
# Percentiles need a histogram. Without these the Grafana p95 panels render empty, because
# a plain timer publishes only count, sum and max.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.airline.ai.feature=true
management.metrics.distribution.percentiles-histogram.airline.ai.agent=true
# The Grafana panel for model latency reads _bucket, which only exists with this on.
# Without it the panel renders empty and looks like the metric is missing.
management.metrics.distribution.percentiles-histogram.airline.ai.model.call=true

# ---------- Logging ----------
# Uncomment to watch the JSON-RPC traffic between this app and the MCP server.
# logging.level.dev.langchain4j.mcp=DEBUG
logging.level.com.telusko.airline=INFO
