# Started automatically by Spring Boot Docker Compose support. PostgreSQL stores both
# business data and pgvector embeddings.
services:
  postgres:
    # PostgreSQL 16 image with the pgvector extension available to init/schema.sql.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: airline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: telusko
    ports:
      # Host port 5433 avoids conflicts with a PostgreSQL instance on the default port.
      - "5433:5432"
    volumes:
      - airline-db:/var/lib/postgresql/data
    healthcheck:
      # Delay DataSource initialization until PostgreSQL accepts connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  airline-db:
