# Optional Prometheus and Grafana services are separate from the backend's required
# PostgreSQL Compose service. Start them from the project directory with:
#
#   docker compose -f monitoring/docker-compose.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # The backend runs on the host, not in this network. Without this the scrape target
      # localhost:8080 would mean the Prometheus container itself and find nothing.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      # Local-only anonymous administration. Configure authentication before exposing Grafana.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
